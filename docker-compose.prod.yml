# this file described a reference production setup of Kleinkram
services:
    base:
        image: kleinkram-base
        build:
            context: .
            dockerfile: docker/base.Dockerfile

    api-server:
        image: rslethz/kleinkram:api-server-latest
        container_name: kleinkram-api-server-prod

        build:
            context: .
            dockerfile: docker/backend.Dockerfile
            target: production
            additional_contexts:
                kleinkram-base: service:base

        ports:
            - 127.0.0.1:${SERVER_PORT}:${SERVER_PORT}

        env_file:
            # NOTE: this is the literal file compose reads for container env.
            # `docker compose --env-file X` does NOT change it (that flag only
            # affects ${VAR} interpolation), so it must name .env.prod directly.
            - .env.prod

        networks:
            - webnet
            - privatenet
        environment:
            SEED: 'false'
            DEVBUILD: 'false'
            REDIS_HOST: redis
            DB_HOST: postgres
            DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable

        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:17
        container_name: kleinkram-postgres-prod

        # Loopback-only: docker publishes ports via its own iptables chain,
        # which bypasses ufw entirely. The bind address is the real control.
        ports:
            - '127.0.0.1:5432:5432'

        networks:
            - privatenet

        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}

        volumes:
            - postgres_db_data:/var/lib/postgresql/data

    seaweedfs:
        image: chrislusf/seaweedfs:4.17
        container_name: kleinkram-seaweedfs-prod

        command: server -dir=/data -s3 -s3.port=9000

        volumes:
            - seaweedfs_data:/data
            - ./docker/seaweedfs-entrypoint.sh:/docker-entrypoint.sh:ro

        environment:
            S3_DATA_BUCKET_NAME: ${S3_DATA_BUCKET_NAME}
            S3_DB_BUCKET_NAME: ${S3_DB_BUCKET_NAME}
            S3_ARTIFACTS_BUCKET_NAME: ${S3_ARTIFACTS_BUCKET_NAME}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}

        entrypoint: ['/docker-entrypoint.sh']

        ports:
            - '127.0.0.1:9000:9000' # file storage
            - '127.0.0.1:9333:9333' # management console
        networks:
            - webnet
            - privatenet

    frontend:
        image: rslethz/kleinkram:frontend-latest
        container_name: kleinkram-frontend-prod

        build:
            context: .
            dockerfile: docker/frontend.Dockerfile
            target: production
            args:
                - BACKEND_URL=${BACKEND_URL}
                - GIT_BRANCH=${GIT_BRANCH}
                - GIT_COMMIT=${GIT_COMMIT}
                - VITE_S3_ENDPOINT=${S3_ENDPOINT}
                - VITE_DOCS_URL=${DOCS_URL}
            additional_contexts:
                kleinkram-base: service:base

        # Reached only via the reverse proxy on 443.
        ports:
            - '127.0.0.1:8003:80'

        networks:
            - webnet

    redis:
        image: redis:8.10.1
        container_name: kleinkram-redis-prod
        # Redis has no password configured; it must never leave loopback.
        ports:
            - '127.0.0.1:6379:6379'
        networks:
            - privatenet

    queue-consumer:
        image: rslethz/kleinkram:queue-consumer-latest
        container_name: kleinkram-queue-consumer-prod
        # Workers/runners are keyed by hostname. Without this, a restart with no
        # docker socket registers the random container ID as a brand-new (and
        # then forever-offline) device.
        hostname: srv-kleinkram
        build:
            context: .
            dockerfile: docker/queue-consumer.Dockerfile
            target: production
            additional_contexts:
                kleinkram-base: service:base
                artifact-uploader: service:artifact-uploader
        ports:
            - '127.0.0.1:8080:8080'
        env_file:
            - .env.prod
        environment:
            DB_HOST: postgres
            DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable
            REDIS_HOST: redis
            REDIS_PORT: 6379
        networks:
            - privatenet
        depends_on:
            - postgres
            - loki
        volumes:
            # Kleinkram Actions run as containers via this socket, which is
            # root-equivalent control of the host. Who may start an Action is
            # therefore restricted to ADMIN users via ACTIONS_ADMIN_ONLY=true in
            # .env.prod (enforced in ActionDispatcherService, the single
            # chokepoint for UI/CLI/API-key/trigger submissions).
            - /var/run/docker.sock:/var/run/docker.sock
            # NOTE: upstream also bind-mounts ./google-service-account.json. It
            # is left out here: the file does not exist, docker would silently
            # create it as a DIRECTORY, and Drive import is guarded by
            # existsSync/isFile so it just logs a warning when absent.
        group_add:
            - ${DOCKER_GID:-999}

    prometheus:
        image: prom/prometheus:v3.14.0
        container_name: kleinkram-prometheus-prod
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - logging-prometheus-storage:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-remote-write-receiver'
            - '--enable-feature=exemplar-storage'
            - '--enable-feature=native-histograms'
            # Upstream set neither flag: 15d implicit time retention and NO size
            # cap at all. The size cap is the one that actually protects the
            # partition - whichever limit is hit first wins.
            - '--storage.tsdb.retention.time=15d'
            - '--storage.tsdb.retention.size=20GB'
        ports:
            - '127.0.0.1:9090:9090'
        networks:
            - privatenet

    tempo:
        user: '0:0'
        image: grafana/tempo:3.0.0
        container_name: kleinkram-tempo-prod
        command: ['-config.file=/etc/tempo/tempo.yml']
        volumes:
            - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml
            - logging-tempo-data:/tmp/tempo
        # Bare port entries ('3200') publish to a RANDOM host port on all
        # interfaces. Nothing on the host needs these - prometheus, grafana and
        # the app reach tempo by service name on privatenet - so use expose.
        expose:
            - '3200' # tempo
            - '4317' # otlp grpc
            - '4318' # otlp http
        networks:
            - privatenet

    loki:
        image: grafana/loki:3.7.7
        container_name: kleinkram-loki-prod
        # auth_enabled is false in loki-config.yml, i.e. unauthenticated log
        # read AND ingest. Upstream published this on all interfaces.
        ports:
            - '127.0.0.1:3100:3100'
        command:
            - --config.file=/mnt/config/loki-config.yml
            - -log.level=error
        volumes:
            - ./observability/loki/loki-config.yml:/mnt/config/loki-config.yml:ro
            # Upstream mounted no data volume, so loki wrote to /tmp inside the
            # container: logs were lost on recreate and the writes landed in
            # /var/lib/docker/overlay2 on the root partition.
            - logging-loki-data:/loki
        networks:
            - privatenet

    grafana:
        image: grafana/grafana:13.2.1
        container_name: kleinkram-grafana-prod
        volumes:
            - logging-grafana-storage:/var/lib/grafana
            - ./observability/grafana/provisioning:/etc/grafana/provisioning

        environment:
            - GF_LOG_LEVEL=critical
        ports:
            - '127.0.0.1:9050:3000' # localhost:9050 for accessing grafana
        networks:
            - privatenet

    documentation:
        image: rslethz/kleinkram:docs-latest
        container_name: kleinkram-documentation-prod
        build:
            context: .
            dockerfile: docker/docs.Dockerfile
            target: production
        ports:
            - '127.0.0.1:4000:80'
        volumes:
            # The FSR enterprise CA root, served at /fsrnet-root.crt so users can
            # self-serve it (see docs/usage/fsr-instance.md). certs/ is gitignored,
            # so the file is bind-mounted at runtime rather than baked into the image.
            - ./certs/fsrnet-root.crt:/usr/share/nginx/html/fsrnet-root.crt:ro
        networks:
            - webnet

    caddy:
        image: caddy:2-alpine
        container_name: kleinkram-caddy-prod
        # The ONLY service published beyond loopback. 443 for the three
        # hostnames, 80 solely for the automatic HTTPS redirect.
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./certs/site:/certs:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - webnet
        depends_on:
            - frontend
            - api-server
            - seaweedfs
            - documentation

    artifact-uploader:
        image: rslethz/kleinkram:artifact-uploader-latest
        build:
            context: queueConsumer/src/artifactUpload
            dockerfile: Dockerfile

volumes:
    postgres_db_data:
    seaweedfs_data:
    logging-prometheus-storage:
    logging-grafana-storage:
    logging-tempo-data:
    logging-loki-data:
    caddy_data:
    caddy_config:

networks:
    webnet:
    privatenet:
