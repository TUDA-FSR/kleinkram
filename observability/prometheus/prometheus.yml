global:
    # Was 10s on every job. 30s cuts TSDB sample volume ~3x, which matters on a
    # single 1TB partition shared with the actual bag/mcap data.
    scrape_interval: 30s
    scrape_timeout: 10s

scrape_configs:
    - job_name: 'prometheus'
      static_configs:
          - targets: ['localhost:9090']

    - job_name: 'tempo'
      scheme: http
      static_configs:
          - targets: ['tempo:3200']

    - job_name: storage-job
      metrics_path: /metrics
      scheme: http
      static_configs:
          - targets: ['seaweedfs:9324']

    # NOTE: upstream also scraped 'postgres-exporter:9187', but no such service
    # exists in docker-compose.prod.yml. Left out rather than scraped forever at
    # a dead target. Add the exporter service back if you want DB metrics.

    # NOTE: upstream targeted host 'main', which is the dev-compose service name.
    # In docker-compose.prod.yml the backend service is 'api-server'.
    - job_name: 'backend:syst_stats'
      metrics_path: /metrics
      static_configs:
          - targets: ['api-server:3000']

    - job_name: 'backend:traces'
      metrics_path: /metrics
      static_configs:
          - targets: ['api-server:9464']
