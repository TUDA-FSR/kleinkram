auth_enabled: false

server:
    http_listen_port: 3100

common:
    # /loki is a named docker volume; upstream defaulted to /tmp inside the
    # container, which grew the overlay2 dir on / and lost logs on recreate.
    path_prefix: /loki
    replication_factor: 1
    ring:
        kvstore:
            store: memberlist

schema_config:
    configs:
        - from: 2020-05-15
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h

storage_config:
    filesystem:
        directory: /loki/chunks

ingester:
    wal:
        enabled: true
        dir: /loki/wal
    lifecycler:
        final_sleep: 0s
    chunk_idle_period: 1h # Any chunk not receiving new logs in this time will be flushed
    max_chunk_age: 1h # All chunks will be flushed when they hit this age, default is 1h
    chunk_target_size: 1048576 # Loki will attempt to build chunks up to 1.5MB, flushing first if chunk_idle_period or max_chunk_age is reached first
    chunk_retain_period: 30s # Must be greater than index read cache TTL if using an index cache (Default index read cache TTL is 5m)

limits_config:
    max_entries_limit_per_query: 50000
    retention_period: 336h # 14 days (was 30d) - single 1TB partition
    retention_stream:
        - selector: '{job="queue-consumer"}'
          priority: 1
          period: 720h # 30 days for action logs (was 90d)

    # Bound worst-case ingest so a log-spamming service cannot fill the disk
    # between compactor runs.
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 10MB
    max_global_streams_per_user: 5000
    reject_old_samples: true
    reject_old_samples_max_age: 168h

compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    retention_delete_delay: 1h
    compaction_interval: 10m
    delete_request_store: filesystem
